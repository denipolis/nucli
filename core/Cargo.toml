[package]
name = "nucli-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
futures = "0.3"
getrandom = "0.3.4"
gpui.workspace = true
if-addrs = "0.15.0"
mdns-sd = { version = "0.21.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = "0.10.0"
spake2 = "0.4.0"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
