[package]
name = "nucli"
version = "2.0.0"
edition = "2024"
license = "MIT"
description = "A cross-platform terminal built for AI coding agents"
repository = "https://github.com/denipolis/nucli"
publish = false

[dependencies]
dirs = "7"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
