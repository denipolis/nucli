[package]
name = "nucli"
version = "2.14.0"
edition = "2024"
license = "MIT"
description = "A cross-platform terminal built for AI coding agents"
repository = "https://github.com/denipolis/nucli"
publish = false

[workspace]
members = ["core", "grammars", "mobile"]

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui_ios = { package = "gpui-pre-ios", version = "=0.3.10" }

[dependencies]
nucli-core = { path = "core" }
nucli-grammars = { path = "grammars" }
alacritty_terminal = "0.26.0"
anyhow = "1"
base64 = "0.22"
dirs = "7"
futures = "0.3"
gpui.workspace = true
gpui_platform.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40.1"
trash = "5"
tree-sitter = "0.27.1"
tree-sitter-highlight = "0.27.1"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
notify = "8"
portable-pty = "0.9.0"
uuid = { version = "1", features = ["v4"] }
fancy-regex = "0.20.0"
qrcode = { version = "0.14.1", default-features = false }

[features]
default = ["grammars"]
grammars = ["nucli-grammars/all"]
split = []

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1"
core-graphics = "0.24"
objc = "0.2"
plist = "1"
sha2 = "0.10"

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[target."cfg(unix)".dependencies]
libc = "0.2"
