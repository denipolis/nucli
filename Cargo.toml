[package]
name = "nucli"
version = "2.0.0"
edition = "2024"
license = "MIT"
description = "A cross-platform terminal built for AI coding agents"
repository = "https://github.com/denipolis/nucli"
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1"
dirs = "7"
futures = "0.3"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
image = { version = "0.25", default-features = false, features = ["png"] }
