[package]
name = "nucli"
version = "2.3.0"
edition = "2024"
license = "MIT"
description = "A cross-platform terminal built for AI coding agents"
repository = "https://github.com/denipolis/nucli"
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1"
dirs = "7"
futures = "0.3"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40.1"
trash = "5"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-highlight = "0.27.1"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-lua = "0.5.0"
tree-sitter-make = "1.1.1"
tree-sitter-md = "0.5.4"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.4"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
notify = "8"
portable-pty = "0.9.0"
uuid = { version = "1", features = ["v4"] }
fancy-regex = "0.20.0"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1"
core-graphics = "0.24"
objc = "0.2"
plist = "1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[target."cfg(unix)".dependencies]
libc = "0.2"
