[package]
name = "nucli-uplink"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
dirs = "7"
futures = "0.3"
gpui.workspace = true
gpui_platform.workspace = true
nucli-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "ios")'.dependencies]
gpui_ios.workspace = true
dispatch2 = "0.3"
libc = "0.2"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "dispatch2", "objc2-quartz-core", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureMetadataOutput", "AVCaptureSession", "AVCaptureVideoPreviewLayer", "AVMediaFormat", "AVMetadataObject", "AVAnimation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSObject"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-quartz-core", "objc2-core-foundation", "UIApplication", "UIResponder", "UIScene", "UIWindowScene", "UIWindow", "UIView", "UIViewController", "UIColor", "UILabel", "UIGestureRecognizer", "UITapGestureRecognizer", "UIGeometry", "UIInterface", "UIScreen", "NSText", "block2"] }
